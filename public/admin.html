<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Sonata Karaoke</title>
  <link rel="icon" href="/images/logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="navbar at-top" id="navbar">
    <a href="/index.html" class="brand" aria-label="Sonata Karaoke">
      <img src="/images/logo.png" alt="Sonata" class="brand-logo" />
    </a>

    <nav class="nav-menu" id="navMenu" aria-label="Main">
      <a href="/index.html#top" class="nav-anchor">Home</a>
      <a href="/index.html#about" class="nav-anchor">About</a>
      <a href="/index.html#rooms" class="nav-anchor">Rooms</a>
      <a href="/index.html#how" class="nav-anchor">How it works</a>
      <a href="/index.html#info" class="nav-anchor">Info</a>
    </nav>

    <div class="nav-right">
      <span id="navAuth"></span>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main id="adminContent" class="section admin-page" hidden>
  <header class="section-head">
    <span class="eyebrow">Admin</span>
    <h2>Dashboard</h2>
  </header>

  <div class="admin-layout">
    <form id="roomForm" class="card admin-form">
      <h3 id="formTitle">Add Room</h3>
      <label class="field">
        <span>Room name</span>
        <input type="text" name="name" placeholder="e.g. Vegas Suite" required />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Capacity</span>
          <input type="number" name="capacity" placeholder="People" min="1" required />
        </label>
        <label class="field">
          <span>Price per hour</span>
          <input type="number" name="pricePerHour" placeholder="Rp" min="1" required />
        </label>
      </div>
      <label class="field">
        <span>Description</span>
        <textarea name="description" placeholder="Short description" rows="3" required></textarea>
      </label>
      <p id="formMsg" class="error"></p>
      <div class="actions">
        <button type="submit" class="btn" id="formSubmit">Save Room</button>
        <button type="button" class="btn btn-outline" id="cancelEdit" hidden>Cancel edit</button>
      </div>
    </form>

    <section class="admin-rooms card">
    <h3 class="block-title">Rooms</h3>
    <div id="adminRoomList" class="grid"></div>
    </section>
  </div>

  <h3 class="block-title">All Bookings</h3>
  <p id="bookingMsg" class="error"></p>
  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th><th>Customer</th><th>Room</th><th>Schedule</th>
          <th>Total</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="adminBookingList"></tbody>
    </table>
  </div>
</main>

  <footer class="footer">
    <div class="footer-bar">
      <img src="/images/logo.png" alt="Sonata" class="footer-logo" />
      <p>&copy; Sonata Karaoke</p>
    </div>
  </footer>

  <script src="/layout.js"></script>
  <script src="/script.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
