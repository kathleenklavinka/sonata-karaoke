<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment | Sonata Karaoke</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="navbar at-top" id="navbar">
    <a href="/index.html" class="brand" aria-label="Sonata Karaoke">
      <img src="/images/logo.png" alt="Sonata" class="brand-logo" />
    </a>

    <nav class="nav-menu" id="navMenu" aria-label="Main">
      <a href="/index.html#top" class="nav-anchor">Home</a>
      <a href="/index.html#about" class="nav-anchor">About</a>
      <a href="/index.html#rooms" class="nav-anchor">Rooms</a>
      <a href="/index.html#how" class="nav-anchor">How it works</a>
      <a href="/index.html#info" class="nav-anchor">Info</a>
    </nav>

    <div class="nav-right">
      <span id="navAuth"></span>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="section pay-page">
    <header class="section-head">
      <span class="eyebrow">Payment</span>
      <h2>Complete your payment</h2>
    </header>
    <p id="pageMsg" class="muted pay-status">Loading booking...</p>

    <div id="payContent" class="card pay-card" hidden>
      <div class="pay-top">
        <span class="pay-label">Booking summary</span>
        <span id="payCountdown" class="pay-timer"></span>
      </div>

      <h3 id="payRoom" class="pay-room"></h3>

      <div class="pay-row">
        <span class="muted">Schedule</span>
        <span id="payTime"></span>
      </div>

      <div class="pay-total-box">
        <span class="muted">Total</span>
        <span id="payTotal" class="pay-total"></span>
      </div>

      <p id="payMsg" class="error"></p>

      <div class="pay-actions">
        <button type="button" class="btn" id="payBtn">Pay now</button>
        <a href="/my-bookings.html" class="btn btn-outline">My bookings</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bar">
      <img src="/images/logo.png" alt="Sonata" class="footer-logo" />
      <p>&copy; Sonata Karaoke</p>
    </div>
  </footer>

  <script src="/layout.js"></script>
  <script src="/script.js"></script>
<script>
  const bookingId = new URLSearchParams(window.location.search).get('booking');
  const el = (id) => document.getElementById(id);
  let booking = null;
  let timer = null;
  let expired = false;

  function tick() {
    const left = new Date(booking.expiresAt).getTime() - Date.now();
    if (left <= 0) {
      expired = true;
      clearInterval(timer);
      el('payCountdown').textContent = 'Expired';
      el('payCountdown').classList.add('urgent');
      el('payMsg').textContent = 'Time is up. This booking has expired.';
      el('payBtn').disabled = true;
      return;
    }
    const m = Math.floor(left / 60000);
    const s = Math.floor((left % 60000) / 1000);
    el('payCountdown').textContent = `Pay within ${m}:${String(s).padStart(2, '0')}`;
    el('payCountdown').classList.toggle('urgent', left < 60000);
  }

  el('payBtn').addEventListener('click', async () => {
    const btn = el('payBtn');
    btn.disabled = true;
    el('payMsg').textContent = '';
    try {
      await api(`/payments/${encodeURIComponent(bookingId)}/fake`, { method: 'POST' });
      window.location.href = '/my-bookings.html';
    } catch (err) {
      if (err.status === 401) return logout();
      el('payMsg').textContent = err.message;
      btn.disabled = expired;
    }
  });

  (async () => {
    if (!localStorage.getItem('token')) {
      window.location.href = '/index.html';
      return;
    }
    if (!bookingId) {
      el('pageMsg').textContent = 'No booking selected.';
      return;
    }
    try {
      const { bookings } = await api('/bookings/me');
      booking = bookings.find((b) => b.id === bookingId);
    } catch (err) {
      if (err.status === 401) return logout();
      el('pageMsg').textContent = err.message;
      return;
    }
    if (!booking) {
      el('pageMsg').textContent = 'Booking not found.';
      return;
    }
    if (booking.status !== 'PENDING') {
      el('pageMsg').innerHTML = `This booking is ${statusBadge(booking.status)}, so no payment is needed. <a href="/my-bookings.html">View my bookings</a>`;
      return;
    }
    el('payRoom').textContent = booking.room.name;
    el('payTime').textContent = fmtRange(booking.startTime, booking.endTime);
    el('payTotal').textContent = rupiah(booking.totalPrice);
    el('pageMsg').hidden = true;
    el('payContent').hidden = false;
    tick();
    timer = setInterval(tick, 1000);
  })();
</script>
</body>
</html>
